<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Two torch-lit ridges facing each other across a fog-filled valley, a lone runner half-hidden in the mist">
  <rect width="800" height="450" fill="#efe5d2"/>
  <!-- stars -->
  <g fill="#a3947b" opacity="0.5">
    <circle cx="110" cy="60" r="2"/><circle cx="250" cy="40" r="1.5"/><circle cx="330" cy="95" r="1.5"/>
    <circle cx="520" cy="50" r="2"/><circle cx="620" cy="90" r="1.5"/><circle cx="720" cy="45" r="2"/>
  </g>
  <!-- moon -->
  <circle cx="400" cy="82" r="28" fill="#f6efe2" stroke="#d8c9ac" stroke-width="2"/>
  <circle cx="391" cy="75" r="5" fill="#e6d8bd"/>
  <circle cx="406" cy="92" r="3.5" fill="#e6d8bd"/>
  <!-- distant hills -->
  <path d="M0 330 Q120 270 240 320 Q330 355 400 340 Q500 318 590 335 Q700 356 800 320 L800 450 L0 450 Z" fill="#d8c9ac" opacity="0.55"/>
  <!-- left ridge -->
  <path d="M0 450 L0 305 Q40 265 75 235 Q105 210 138 200 Q165 208 190 250 Q225 310 260 370 Q280 405 298 450 Z" fill="#5b4a33"/>
  <!-- right ridge -->
  <path d="M800 450 L800 300 Q765 262 728 232 Q700 208 668 198 Q640 206 616 246 Q580 308 546 368 Q525 404 508 450 Z" fill="#5b4a33"/>
  <!-- left torch -->
  <circle cx="138" cy="165" r="34" fill="#d98a5f" opacity="0.18"/>
  <line x1="138" y1="200" x2="138" y2="172" stroke="#2d2418" stroke-width="4" stroke-linecap="round"/>
  <path d="M138 138 C147 150 149 161 141 167 C134 172 127 166 128 158 C129 149 133 143 138 138 Z" fill="#a4502c"/>
  <path d="M138 148 C143 154 144 160 140 163 C136 166 132 162 133 157 C134 153 136 150 138 148 Z" fill="#e8b27d"/>
  <!-- right torch -->
  <circle cx="668" cy="163" r="34" fill="#d98a5f" opacity="0.18"/>
  <line x1="668" y1="198" x2="668" y2="170" stroke="#2d2418" stroke-width="4" stroke-linecap="round"/>
  <path d="M668 136 C677 148 679 159 671 165 C664 170 657 164 658 156 C659 147 663 141 668 136 Z" fill="#a4502c"/>
  <path d="M668 146 C673 152 674 158 670 161 C666 164 662 160 663 155 C664 151 666 148 668 146 Z" fill="#e8b27d"/>
  <!-- chiefs (small silhouettes) -->
  <g fill="#2d2418">
    <circle cx="118" cy="206" r="5"/><path d="M112 226 Q118 210 124 226 Z"/>
    <circle cx="688" cy="204" r="5"/><path d="M682 224 Q688 208 694 224 Z"/>
  </g>
  <!-- runner in the valley -->
  <g fill="#6b5d49">
    <circle cx="398" cy="366" r="6"/>
    <path d="M390 392 Q394 372 402 374 Q410 378 408 392 L402 390 Q398 380 396 390 Z"/>
  </g>
  <!-- fog -->
  <g fill="#f6efe2">
    <ellipse cx="240" cy="402" rx="175" ry="46" opacity="0.9"/>
    <ellipse cx="430" cy="424" rx="210" ry="52" opacity="0.95"/>
    <ellipse cx="575" cy="396" rx="160" ry="42" opacity="0.85"/>
    <ellipse cx="400" cy="385" rx="120" ry="26" opacity="0.7"/>
    <ellipse cx="320" cy="360" rx="90" ry="20" opacity="0.5"/>
    <ellipse cx="500" cy="355" rx="85" ry="18" opacity="0.5"/>
  </g>
  <!-- frame -->
  <rect x="6" y="6" width="788" height="438" rx="12" fill="none" stroke="#d8c9ac" stroke-width="3"/>
</svg>
