<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A clerk pins a small note to a wooden harbor gate post at dusk while boats sail past on calm water, flat papercut storybook style.">
  <rect x="0" y="0" width="800" height="450" fill="#f6efe2"/>

  <!-- sky band -->
  <rect x="0" y="0" width="800" height="270" fill="#efe5d2"/>

  <!-- distant hills -->
  <polygon points="0,230 120,175 260,225 400,165 560,220 700,180 800,225 800,270 0,270" fill="#a3947b" opacity="0.35"/>

  <!-- sun / lantern glow in sky -->
  <ellipse cx="650" cy="95" rx="46" ry="46" fill="#e8b27d" opacity="0.55"/>
  <ellipse cx="650" cy="95" rx="26" ry="26" fill="#e8b27d" opacity="0.85"/>

  <!-- birds -->
  <path d="M120,80 q10,-12 20,0 q10,-12 20,0" fill="none" stroke="#6b5d49" stroke-width="3" stroke-linecap="round"/>
  <path d="M180,110 q8,-10 16,0 q8,-10 16,0" fill="none" stroke="#6b5d49" stroke-width="3" stroke-linecap="round"/>

  <!-- water -->
  <rect x="0" y="270" width="800" height="180" fill="#efe5d2"/>
  <path d="M0,300 q40,10 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0" fill="none" stroke="#d8c9ac" stroke-width="3" opacity="0.7"/>
  <path d="M0,335 q40,10 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0" fill="none" stroke="#d8c9ac" stroke-width="3" opacity="0.5"/>
  <path d="M0,370 q40,10 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0" fill="none" stroke="#d8c9ac" stroke-width="3" opacity="0.4"/>

  <!-- boats on the water -->
  <g>
    <polygon points="70,300 130,300 115,318 85,318" fill="#a4502c"/>
    <line x1="100" y1="300" x2="100" y2="272" stroke="#5b4a33" stroke-width="3"/>
    <polygon points="101,274 101,296 122,292" fill="#d98a5f"/>
  </g>
  <g>
    <polygon points="600,315 668,315 651,335 617,335" fill="#a4502c"/>
    <line x1="634" y1="315" x2="634" y2="284" stroke="#5b4a33" stroke-width="3"/>
    <polygon points="635,286 635,311 660,306" fill="#d98a5f"/>
  </g>
  <g>
    <polygon points="690,355 740,355 727,370 703,370" fill="#a4502c"/>
    <line x1="715" y1="355" x2="715" y2="332" stroke="#5b4a33" stroke-width="3"/>
    <polygon points="716,334 716,352 734,348" fill="#d98a5f"/>
  </g>

  <!-- dock platform -->
  <polygon points="0,400 800,400 800,450 0,450" fill="#6b5d49"/>
  <polygon points="0,395 800,395 800,405 0,405" fill="#5b4a33" opacity="0.5"/>

  <!-- dock planks -->
  <line x1="60" y1="400" x2="60" y2="450" stroke="#2d2418" stroke-width="2" opacity="0.3"/>
  <line x1="180" y1="400" x2="180" y2="450" stroke="#2d2418" stroke-width="2" opacity="0.3"/>
  <line x1="300" y1="400" x2="300" y2="450" stroke="#2d2418" stroke-width="2" opacity="0.3"/>
  <line x1="470" y1="400" x2="470" y2="450" stroke="#2d2418" stroke-width="2" opacity="0.3"/>
  <line x1="590" y1="400" x2="590" y2="450" stroke="#2d2418" stroke-width="2" opacity="0.3"/>
  <line x1="710" y1="400" x2="710" y2="450" stroke="#2d2418" stroke-width="2" opacity="0.3"/>

  <!-- harbor gate structure -->
  <rect x="250" y="150" width="24" height="255" fill="#5b4a33"/>
  <rect x="390" y="150" width="24" height="255" fill="#5b4a33"/>
  <rect x="240" y="140" width="188" height="24" fill="#5b4a33"/>

  <!-- hanging lantern from crossbeam -->
  <line x1="335" y1="164" x2="335" y2="190" stroke="#2d2418" stroke-width="2"/>
  <ellipse cx="335" cy="202" rx="12" ry="15" fill="#e8b27d"/>
  <ellipse cx="335" cy="202" rx="6" ry="8" fill="#d98a5f"/>

  <!-- pinned note on left post -->
  <g transform="rotate(-6 262 220)">
    <rect x="248" y="204" width="30" height="34" fill="#e6d8bd" stroke="#a4502c" stroke-width="2"/>
    <line x1="254" y1="213" x2="272" y2="213" stroke="#a3947b" stroke-width="2"/>
    <line x1="254" y1="220" x2="272" y2="220" stroke="#a3947b" stroke-width="2"/>
    <line x1="254" y1="227" x2="266" y2="227" stroke="#a3947b" stroke-width="2"/>
  </g>
  <circle cx="262" cy="206" r="2.5" fill="#2d2418"/>

  <!-- clerk figure pinning the note -->
  <g>
    <ellipse cx="222" cy="270" rx="13" ry="14" fill="#2d2418"/>
    <path d="M205,285 q17,-14 34,0 l0,60 q-17,10 -34,0 z" fill="#2d2418"/>
    <path d="M232,278 q22,-10 30,-58" fill="none" stroke="#2d2418" stroke-width="6" stroke-linecap="round"/>
    <path d="M212,290 l-14,50" fill="none" stroke="#2d2418" stroke-width="6" stroke-linecap="round"/>
    <path d="M232,290 l12,52" fill="none" stroke="#2d2418" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- old inspector figure with manifest, near right post -->
  <g>
    <ellipse cx="460" cy="272" rx="13" ry="14" fill="#6b5d49"/>
    <path d="M443,287 q17,-14 34,0 l0,58 q-17,10 -34,0 z" fill="#6b5d49"/>
    <rect x="452" y="292" width="26" height="34" fill="#e6d8bd" stroke="#a3947b" stroke-width="2"/>
    <line x1="457" y1="300" x2="473" y2="300" stroke="#a3947b" stroke-width="2"/>
    <line x1="457" y1="308" x2="473" y2="308" stroke="#a3947b" stroke-width="2"/>
    <line x1="457" y1="316" x2="469" y2="316" stroke="#a3947b" stroke-width="2"/>
    <path d="M430,295 l-10,48" fill="none" stroke="#6b5d49" stroke-width="6" stroke-linecap="round"/>
    <path d="M470,295 l10,48" fill="none" stroke="#6b5d49" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- small crates on dock -->
  <rect x="510" y="368" width="26" height="26" fill="#d98a5f" stroke="#a4502c" stroke-width="2"/>
  <rect x="540" y="374" width="20" height="20" fill="#e8b27d" stroke="#a4502c" stroke-width="2"/>
  <rect x="100" y="372" width="24" height="22" fill="#d98a5f" stroke="#a4502c" stroke-width="2"/>

  <!-- frame -->
  <rect x="6" y="6" width="788" height="438" rx="10" fill="none" stroke="#d8c9ac" stroke-width="3"/>
</svg>
