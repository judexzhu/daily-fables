---
layout: default
---
<p class="index-hint">One fable a day, one graduate-level cloud concept. Hover a chip to spoil the reveal.</p>

<ul class="fable-list">
{% for post in site.posts %}
  <li>
    <span class="date">{{ post.date | date: "%Y-%m-%d" }}</span>
    <span class="titles">
      <a href="{{ post.url | relative_url }}">{{ post.title_en | default: post.title }}</a>
    </span>
    <span class="concept-chip">{{ post.concept }}</span>
  </li>
{% endfor %}
</ul>
