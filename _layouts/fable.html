---
layout: default
---
<article class="fable-page">
  <p class="fable-date">{{ page.date | date: "%Y-%m-%d" }}</p>
  <h1 class="fable-title">{{ page.title }}</h1>
  <p class="fable-concept">concept: <span class="concept-chip">{{ page.concept }}</span></p>

  <div class="lang-toggle" role="tablist">
    <button data-lang="zh" aria-pressed="false">中文</button>
    <button data-lang="both" aria-pressed="true">对照</button>
    <button data-lang="en" aria-pressed="false">English</button>
  </div>

  <div class="fable-body">
    {{ content }}
  </div>

  <nav class="fable-nav">
    {% if page.next %}<a href="{{ page.next.url | relative_url }}">← {{ page.next.date | date: "%m-%d" }}</a>{% endif %}
    {% if page.previous %}<a class="right" href="{{ page.previous.url | relative_url }}">{{ page.previous.date | date: "%m-%d" }} →</a>{% endif %}
  </nav>
</article>
<script>
(function () {
  var body = document.querySelector('.fable-body');
  var buttons = document.querySelectorAll('.lang-toggle button');
  function setLang(lang) {
    body.className = 'fable-body lang-' + lang;
    buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    try { localStorage.setItem('fable-lang', lang); } catch (e) {}
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.lang); });
  });
  var saved = 'both';
  try { saved = localStorage.getItem('fable-lang') || 'both'; } catch (e) {}
  setLang(saved);
})();
</script>
