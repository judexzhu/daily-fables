<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai:wght@400;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<script>
  // Set the language before first paint so there is no flash of the wrong script.
  (function () {
    var l = 'en';
    try { l = localStorage.getItem('fable-lang') || 'en'; } catch (e) {}
    if (l !== 'zh') l = 'en';
    document.documentElement.setAttribute('data-lang', l);
    document.documentElement.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
  })();
</script>
</head>
<body>

<div class="site-bar">
  <div class="wrap bar-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span>Daily Fables</span>
      <span class="mark-zh zh-only">每日寓言</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}"><span class="en-only">Today</span><span class="zh-only">今日</span></a>
      <a href="{{ site.posts.first.url | relative_url }}"><span class="en-only">The fable</span><span class="zh-only">本篇</span></a>
      <a href="{{ '/concepts/' | relative_url }}"><span class="en-only">Concepts</span><span class="zh-only">概念</span></a>
      <a href="{{ '/about/' | relative_url }}"><span class="en-only">About</span><span class="zh-only">关于</span></a>
    </nav>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-set-lang="en">EN</button>
      <button type="button" data-set-lang="zh">中文</button>
    </div>
  </div>
</div>

{{ content }}

<footer class="site-foot">
  <div class="wrap foot-inner">
    <span class="en-only">A fable a day, five minutes with your coffee</span>
    <span class="zh-only">一日一则寓言，配一杯咖啡的五分钟</span>
    <span class="foot-links">
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://github.com/judexzhu/daily-fables">SOURCE</a>
      <a href="https://buymeacoffee.com/judexzhu" target="_blank" rel="noopener">BUY ME A COFFEE</a>
    </span>
  </div>
</footer>

<script>
(function () {
  var root = document.documentElement;
  function set(l) {
    root.setAttribute('data-lang', l);
    root.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
    try { localStorage.setItem('fable-lang', l); } catch (e) {}
    document.querySelectorAll('[data-set-lang]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.setLang === l));
    });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-set-lang]');
    if (b) { set(b.dataset.setLang); }
  });
  set(root.getAttribute('data-lang') || 'en');
})();
</script>
</body>
</html>
